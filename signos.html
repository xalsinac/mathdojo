<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    if (localStorage.getItem('mathlab_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ninja de los Signos | MATH LAB</title>
  
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Signos">
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* ================= VARIABLES DE COLOR ================= */
    :root {
      --bg-primary: #0b1120;
      --bg-card: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --accent-blue: #38bdf8;
      --accent-gold: #fbbf24;
      --accent-success: #10b981;
      --accent-op: #f43f5e;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    /* === LA SOLUCIÓN NUCLEAR === */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      position: fixed; /* Ancla la app a las 4 esquinas físicas */
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden; /* Prohíbe cualquier scroll */
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* EFECTOS PANTALLA COMPLETA */
    @keyframes screenFlash {
      0% { box-shadow: inset 0 0 120px rgba(16, 185, 129, 0.4); }
      100% { box-shadow: inset 0 0 0px rgba(16, 185, 129, 0); }
    }
    body.flash-active {
      animation: screenFlash 0.6s ease-out;
    }

    @keyframes errorFlash {
      0% { box-shadow: inset 0 0 150px rgba(244, 63, 94, 0.5); }
      100% { box-shadow: inset 0 0 0px rgba(244, 63, 94, 0); }
    }
    body.error-active {
      animation: errorFlash 0.5s ease-out;
    }

    /* ANIMACIONES DEL TEXTO CENTRAL */
    @keyframes textPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.2); color: var(--accent-success); text-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
      100% { transform: scale(1); }
    }
    .pop-active {
      animation: textPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes textShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); color: var(--accent-op); text-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
      40%, 80% { transform: translateX(10px); color: var(--accent-op); text-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
    }
    .shake-active {
      animation: textShake 0.4s ease-in-out;
    }

    /* PARTÍCULAS */
    .particle {
      position: fixed;
      pointer-events: none;
      font-size: 2rem;
      opacity: 1;
      z-index: 999;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;
    }

    .theme-toggle-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      padding: 0.6rem 0.8rem;
      font-size: 1.2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      color: var(--text-main);
      z-index: 100;
      transition: all 0.2s;
    }

    /* PANTALLA DE INICIO */
    #screen-home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 2rem;
      text-align: center;
      position: relative;
    }
    .app-logo {
      font-size: 4.5rem;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 4px 10px rgba(56, 189, 248, 0.3));
    }
    .app-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-main);
      margin: 0 0 0.5rem 0;
      line-height: 1.1;
    }
    .app-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }

    .mode-btn {
      width: 100%;
      max-width: 320px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      border-radius: 16px;
      border: 2px solid transparent;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    .mode-btn:active { transform: scale(0.95); }
    
    .btn-easy { background: rgba(56, 189, 248, 0.1); border-color: #38bdf8; color: #38bdf8; }
    .btn-easy:hover { background: #38bdf8; color: #0f172a; }
    
    .btn-hard { background: rgba(244, 63, 94, 0.1); border-color: #f43f5e; color: #f43f5e; }
    .btn-hard:hover { background: #f43f5e; color: #fff; }

    .btn-desc { font-size: 0.85rem; font-weight: 600; opacity: 0.85; }

    /* PANTALLA DE JUEGO (REDISEÑADA PARA BLOQUEO ABSOLUTO) */
    #screen-game {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 0.5rem;
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      box-sizing: border-box;
    }

    .game-header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 4rem 0.5rem 0.5rem;
    }
    .btn-back {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.5rem 0.8rem;
      font-weight: bold;
    }
    .score-board {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-success);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-weight: 900;
      font-size: 1.1rem;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .problem-container {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      font-weight: 900;
      font-family: monospace;
      letter-spacing: -2px;
      text-align: center;
      padding: 0.2rem;
      color: var(--text-main);
      position: relative;
      white-space: nowrap;
      width: 100%;
      box-sizing: border-box;
    }

    #problem-display.long-math {
      font-size: clamp(1.4rem, 7vw, 3.5rem);
      letter-spacing: -1px;
    }

    /* BURBUJAS DE OPCIONES */
    .options-grid {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      padding: 0.5rem;
      margin-bottom: calc(0.5rem + env(safe-area-inset-bottom));
    }
    .option-btn {
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      font-weight: 900;
      font-family: monospace;
      padding: 1.2rem 0.2rem; 
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      text-align: center;
    }
    .option-btn:active { transform: scale(0.92); }
    
    .opt-c1 { background: rgba(56, 189, 248, 0.15); border: 2px solid #38bdf8; }
    .opt-c2 { background: rgba(244, 63, 94, 0.15); border: 2px solid #f43f5e; }
    .opt-c3 { background: rgba(251, 191, 36, 0.15); border: 2px solid #fbbf24; }
    .opt-c4 { background: rgba(16, 185, 129, 0.15); border: 2px solid #10b981; }

    .option-btn.correct { background: var(--accent-success) !important; border-color: var(--accent-success) !important; color: #022c22 !important; box-shadow: 0 0 25px rgba(16, 185, 129, 0.6); }
    .option-btn.wrong { background: var(--accent-op) !important; border-color: var(--accent-op) !important; color: #fff !important; box-shadow: 0 0 25px rgba(244, 63, 94, 0.6); }
    .option-btn.disabled { pointer-events: none; opacity: 0.25; transform: scale(0.95); }

    /* TARJETA DE EXPLICACIÓN */
    #feedback-panel {
      position: fixed;
      bottom: -150%;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 450px;
      background: var(--bg-card);
      border: 3px solid #f43f5e;
      padding: 1.5rem;
      box-sizing: border-box;
      border-radius: 20px;
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 50;
      box-shadow: 0 15px 40px rgba(244, 63, 94, 0.3);
    }
    #feedback-panel.show { bottom: 20px; }
    
    .feedback-title {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 0.8rem;
      color: #f43f5e;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .feedback-text {
      font-size: 1.15rem;
      line-height: 1.5;
      color: var(--text-main);
      margin-bottom: 1.5rem;
    }
    .feedback-text strong { color: var(--accent-gold); }

    .btn-next {
      width: 100%;
      padding: 1rem;
      background: #f43f5e;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-next:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Cambiar tema">
    <span id="theme-icon">☀️</span>
  </button>

  <div id="screen-home">
    <div class="app-logo">🥷</div>
    <h1 class="app-title">Ninja de<br>los Signos</h1>
    <p class="app-subtitle">Entrena los números enteros</p>

    <button class="mode-btn btn-easy" onclick="startGame('facil')">
      Cinturón Blanco
      <span class="btn-desc">Operaciones directas: -2 · (-3)</span>
    </button>

    <button class="mode-btn btn-hard" onclick="startGame('combinado')">
      Cinturón Negro
      <span class="btn-desc">Jerarquía y potencias: 4 - (-2)²</span>
    </button>
  </div>

  <div id="screen-game">
    <div class="game-header">
      <button class="btn-back" onclick="goHome()">← Salir</button>
      <div class="score-board">Racha: <span id="score-count">0</span> 🔥</div>
    </div>

    <div class="problem-container">
      <span id="problem-display"></span>
    </div>

    <div class="options-grid" id="options-container">
      <button class="option-btn opt-c1" onclick="checkAnswer(0)" id="opt-0"></button>
      <button class="option-btn opt-c2" onclick="checkAnswer(1)" id="opt-1"></button>
      <button class="option-btn opt-c3" onclick="checkAnswer(2)" id="opt-2"></button>
      <button class="option-btn opt-c4" onclick="checkAnswer(3)" id="opt-3"></button>
    </div>
  </div>

  <div id="feedback-panel">
    <div class="feedback-title"><span>❌</span> ¡Cuidado con el signo!</div>
    <div class="feedback-text" id="feedback-desc"></div>
    <button class="btn-next" onclick="nextProblem()">Entendido ➔</button>
  </div>

  <script>
    function initTheme() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      document.getElementById('theme-icon').textContent = isLight ? '🌙' : '☀️';
    }
    
    function toggleTheme() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('mathlab_theme', 'dark');
        document.getElementById('theme-icon').textContent = '☀️';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('mathlab_theme', 'light');
        document.getElementById('theme-icon').textContent = '🌙';
      }
    }
    window.addEventListener('DOMContentLoaded', initTheme);

    // ================= FUNCIONES DE JUGABILIDAD (GAME FEEL) =================
    function createExplosion(x, y) {
      const emojis = ['✨', '🔥', '⭐', '🥷', '💥', '🎯'];
      const numParticles = 12;

      for (let i = 0; i < numParticles; i++) {
        let p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        document.body.appendChild(p);

        let angle = Math.random() * Math.PI * 2;
        let velocity = 60 + Math.random() * 120;
        let tx = Math.cos(angle) * velocity;
        let ty = Math.sin(angle) * velocity;
        let rot = Math.random() * 360;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            p.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${Math.random() * 0.8 + 0.5})`;
            p.style.opacity = '0';
          });
        });

        setTimeout(() => p.remove(), 800);
      }
    }

    // ================= MOTOR DE GENERACIÓN =================
    let currentMode = '';
    let currentData = {};
    let racha = 0;
    let buttonsDisabled = false;

    function rand(min, max, avoidZero = true) {
      let val;
      do {
        val = Math.floor(Math.random() * (max - min + 1)) + min;
      } while (avoidZero && val === 0);
      return val;
    }

    function fmt(num, needsParen = true) {
      if (num < 0 && needsParen) return `(${num})`;
      return num;
    }

    function generateEasy() {
      const ops = ['+', '-', '*', '/'];
      const op = ops[Math.floor(Math.random() * ops.length)];
      let a = rand(-10, 10, true);
      let b = rand(-10, 10, true);
      let res, text, exp;

      if (op === '+') {
        res = a + b;
        text = `${a} + ${fmt(b)}`;
        if (a > 0 && b > 0) exp = `Ambos positivos: sumamos normal.`;
        else if (a < 0 && b < 0) exp = `Si debes ${Math.abs(a)} y gastas ${Math.abs(b)}, ahora debes ${Math.abs(res)}.<br><strong>Se suman y mantienen el signo negativo.</strong>`;
        else exp = `Tienen distinto signo: se restan los números y domina el <strong>signo del mayor</strong>.`;
      } 
      else if (op === '-') {
        res = a - b;
        text = `${a} - ${fmt(b)}`;
        if (b < 0) exp = `Restar un negativo es lo mismo que sumar: -(-${Math.abs(b)}) se convierte en +${Math.abs(b)}.<br>La operación real es <strong>${a} + ${Math.abs(b)}</strong>.`;
        else exp = `Restar un positivo. Piensa en dinero: tienes ${a} y te quitan ${b}.`;
      } 
      else if (op === '*') {
        res = a * b;
        text = `${a} · ${fmt(b)}`;
        let regla = (Math.sign(a) === Math.sign(b)) ? "<strong>Menos por menos = MÁS.</strong>" : "<strong>Más por menos = MENOS.</strong>";
        if (a > 0 && b > 0) regla = "<strong>Más por más = MÁS.</strong>";
        exp = `Primero multiplica los números (${Math.abs(a)} · ${Math.abs(b)} = ${Math.abs(res)}).<br>Luego aplica la regla: ${regla}`;
      } 
      else if (op === '/') {
        let cociente = rand(-9, 9, true);
        a = cociente * b;
        res = cociente;
        text = `${a} : ${fmt(b)}`;
        let regla = (Math.sign(a) === Math.sign(b)) ? "<strong>Menos entre menos = MÁS.</strong>" : "<strong>Más entre menos = MENOS.</strong>";
        if (a > 0 && b > 0) regla = "<strong>Más entre más = MÁS.</strong>";
        exp = `Primero divide los números (${Math.abs(a)} : ${Math.abs(b)} = ${Math.abs(res)}).<br>Luego aplica la regla: ${regla}`;
      }
      return { q: text, ans: res, exp: exp };
    }

    function generateCombined() {
      let type = rand(1, 4, false);
      let res, text, exp;
      let a, b, c;

      if (type === 1) {
        a = rand(-5, 5, true); b = rand(-4, 4, true); c = rand(-4, 4, true);
        res = a + (b * c);
        text = `${a} + ${fmt(b)} · ${fmt(c)}`;
        exp = `<strong>¡Jerarquía!</strong> Primero la multiplicación: ${fmt(b)} · ${fmt(c)} = ${b*c}.<br>Luego hacemos la suma: <strong>${a} + ${fmt(b*c)} = ${res}</strong>.`;
      } 
      else if (type === 2) {
        a = rand(-5, 5, true); b = rand(-5, 5, true); c = rand(-3, 3, true);
        res = (a + b) * c;
        text = `(${a} + ${fmt(b)}) · ${fmt(c)}`;
        exp = `<strong>¡Paréntesis!</strong> Primero lo de dentro: (${a} + ${fmt(b)}) = ${a+b}.<br>Luego multiplicamos: <strong>${a+b} · ${fmt(c)} = ${res}</strong>.`;
      }
      else if (type === 3) {
        a = rand(-10, 10, true); b = rand(-4, 4, true);
        res = a - (b * b);
        text = `${a} - ${fmt(b)}²`;
        exp = `<strong>¡Jerarquía!</strong> Primero la potencia: ${fmt(b)}² = ${b*b} (siempre positiva).<br>Luego la resta: <strong>${a} - ${b*b} = ${res}</strong>.`;
      }
      else if (type === 4) {
        a = rand(-10, 10, true); b = rand(-5, 5, true); c = rand(-5, 5, true);
        res = a - (b - c);
        text = `${a} - (${b} - ${fmt(c)})`;
        exp = `<strong>¡Paréntesis!</strong> Primero lo de dentro: (${b} - ${fmt(c)}) = ${b-c}.<br>Luego el menos de delante cambia el signo: <strong>${a} - ${fmt(b-c)} = ${res}</strong>.`;
      }
      return { q: text, ans: res, exp: exp };
    }

    function getOptions(correct) {
      let opts = new Set([correct]);
      opts.add(correct * -1); 
      
      while (opts.size < 4) {
        let errorVariation = correct + rand(-4, 4, true);
        opts.add(errorVariation);
      }
      return Array.from(opts).sort(() => Math.random() - 0.5);
    }

    const classColors = ['opt-c1', 'opt-c2', 'opt-c3', 'opt-c4'];

    function startGame(mode) {
      currentMode = mode;
      racha = 0;
      updateScore();
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById('screen-game').style.display = 'flex';
      nextProblem();
    }

    function goHome() {
      window.location.href = 'index.html'; 
    }

    function updateScore() {
      document.getElementById('score-count').textContent = racha;
    }

    function nextProblem() {
      document.getElementById('feedback-panel').classList.remove('show');
      buttonsDisabled = false;

      currentData = (currentMode === 'facil') ? generateEasy() : generateCombined();
      
      const displayEl = document.getElementById('problem-display');
      displayEl.innerHTML = currentData.q;

      if (currentData.q.length > 11) {
        displayEl.classList.add('long-math');
      } else {
        displayEl.classList.remove('long-math');
      }

      const optionsArray = getOptions(currentData.ans);
      currentData.options = optionsArray;

      for (let i = 0; i < 4; i++) {
        let btn = document.getElementById(`opt-${i}`);
        btn.textContent = optionsArray[i];
        btn.className = `option-btn ${classColors[i]}`;
      }
    }

    function checkAnswer(btnIndex) {
      if (buttonsDisabled) return;
      buttonsDisabled = true;

      const selectedValue = currentData.options[btnIndex];
      const isCorrect = (selectedValue === currentData.ans);
      
      for (let i = 0; i < 4; i++) {
        let btn = document.getElementById(`opt-${i}`);
        if (currentData.options[i] === currentData.ans) {
          btn.classList.add('correct');
        } else if (i === btnIndex && !isCorrect) {
          btn.classList.add('wrong');
        } else {
          btn.classList.add('disabled');
        }
      }

      if (isCorrect) {
        racha++;
        updateScore();
        
        // Disparar partículas
        const btnElement = document.getElementById(`opt-${btnIndex}`);
        const rect = btnElement.getBoundingClientRect();
        createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);

        // Efecto Pantalla Completa y Latido (Acierto)
        document.body.classList.add('flash-active');
        document.getElementById('problem-display').classList.add('pop-active');
        
        setTimeout(() => { 
          document.body.classList.remove('flash-active');
          document.getElementById('problem-display').classList.remove('pop-active');
        }, 600);
        
        setTimeout(() => { nextProblem(); }, 800);
        
      } else {
        racha = 0; 
        updateScore();
        
        // Efecto Pantalla Completa y Temblor (Fallo)
        document.body.classList.add('error-active');
        document.getElementById('problem-display').classList.add('shake-active');
        
        setTimeout(() => { 
          document.body.classList.remove('error-active');
          document.getElementById('problem-display').classList.remove('shake-active');
        }, 500);
        
        document.getElementById('feedback-desc').innerHTML = currentData.exp;
        setTimeout(() => { document.getElementById('feedback-panel').classList.add('show'); }, 300);
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('Fallo al registrar SW', err));
      });
    }
  </script>
</body>
</html>
