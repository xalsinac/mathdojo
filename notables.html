<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    if (localStorage.getItem('mathlab_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katana de los Binomios | MATH LAB</title>
  
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Notables">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="dojo-theme.css">
  <script src="dojo-audio.js" defer></script>
  <script src="dojo-stats.js" defer></script>
  
  <style>
    /* ================= VARIABLES DE COLOR ================= */
    :root {
      --bg-primary: #0b1120;
      --bg-card: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --accent-main: #e11d48; /* Rojo Katana */
      --accent-gold: #fbbf24;
      --accent-success: #10b981;
      --accent-op: #f43f5e;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-main: #be123c;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      position: fixed; /* Ancla la app a las 4 esquinas físicas */
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden; /* Prohíbe cualquier scroll */
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .theme-toggle-btn {
      position: absolute; top: 1rem; right: 1rem;
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; cursor: pointer; padding: 0.6rem 0.8rem;
      font-size: 1.2rem; display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15); color: var(--text-main); z-index: 100;
      transition: all 0.2s;
    }
    .theme-toggle-btn:active { transform: scale(0.9); }

    /* PANTALLA DE INICIO */
    #screen-home {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; padding: 1.5rem; text-align: center; position: relative;
    }
    .app-logo { font-size: 4rem; margin-bottom: 0.5rem; filter: drop-shadow(0 4px 15px rgba(225, 29, 72, 0.4)); }
    .app-title { font-size: 2rem; font-weight: 900; margin: 0 0 0.5rem 0; line-height: 1.1; }
    .app-subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 1.5rem; }

    .levels-grid { display: flex; flex-direction: column; gap: 0.8rem; width: 100%; max-width: 340px; }

    .mode-btn {
      width: 100%; padding: 1rem; border-radius: 16px; border: 2px solid transparent;
      font-size: 1.1rem; font-weight: 800; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
      transition: transform 0.1s;
    }
    .mode-btn:active { transform: scale(0.96); }
    
    .btn-blanco { background: rgba(248, 250, 252, 0.1); border-color: #cbd5e1; color: #f8fafc; }
    [data-theme="light"] .btn-blanco { background: #f1f5f9; color: #334155; border-color: #94a3b8; }
    .btn-naranja { background: rgba(249, 115, 22, 0.15); border-color: #f97316; color: #f97316; }
    .btn-azul { background: rgba(56, 189, 248, 0.15); border-color: #38bdf8; color: #38bdf8; }
    .btn-negro { background: rgba(15, 23, 42, 0.8); border-color: #64748b; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    [data-theme="light"] .btn-negro { background: #0f172a; color: #fff; }
    .btn-desc { font-size: 0.8rem; font-weight: 600; opacity: 0.85; }

    /* PANTALLA DE JUEGO */
    #screen-game {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%; /* Se adapta estrictamente al body fijado */
      padding: 0.5rem;
      /* Forzamos un margen inferior extra de seguridad */
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); 
      box-sizing: border-box;
    }

    .game-header {
      flex-shrink: 0; /* Prohíbe que el header se aplaste */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 4rem 0.5rem 0.5rem;
    }
    .problem-container {
      flex: 1; 
      min-height: 0;
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-size: clamp(2.4rem, 8vw, 4rem); 
      font-weight: 900; 
      font-family: monospace; 
      letter-spacing: -1px;
      text-align: center; 
      padding: 0.2rem; 
      color: var(--text-main); 
      position: relative;
      white-space: nowrap; 
      width: 100%; 
      box-sizing: border-box;
    }
    
    #problem-display.long-math { font-size: clamp(1.6rem, 6vw, 2.5rem); }

    sup { font-size: 0.65em; position: relative; top: -0.6em; color: var(--accent-main); }
    [data-theme="light"] sup { color: var(--accent-main); }
    .sqrt { color: var(--accent-main); margin-right: 2px; }

    /* PARTÍCULAS DEL ACUERTO */
    .particle {
      position: fixed;
      pointer-events: none; /* Para que no estorben si haces clic */
      font-size: 2rem;
      opacity: 1;
      z-index: 999;
      /* La magia del movimiento fluido */
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;
    }   

    /* EFECTO PANTALLA Y LATIDO */
    @keyframes screenFlash {
      0% { box-shadow: inset 0 0 120px rgba(16, 185, 129, 0.4); }
      100% { box-shadow: inset 0 0 0px rgba(16, 185, 129, 0); }
    }
    body.flash-active {
      animation: screenFlash 0.6s ease-out;
    }

    @keyframes textPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.2); color: var(--accent-success); text-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
      100% { transform: scale(1); }
    }
    .pop-active {
      animation: textPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* EFECTOS DE FALLO (ROJO Y TEMBLOR) */
    @keyframes errorFlash {
      0% { box-shadow: inset 0 0 150px rgba(225, 29, 72, 0.5); }
      100% { box-shadow: inset 0 0 0px rgba(225, 29, 72, 0); }
    }
    body.error-active {
      animation: errorFlash 0.5s ease-out;
    }

    @keyframes textShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); color: var(--accent-op); text-shadow: 0 0 15px rgba(225, 29, 72, 0.4); }
      40%, 80% { transform: translateX(10px); color: var(--accent-op); text-shadow: 0 0 15px rgba(225, 29, 72, 0.4); }
    }
    .shake-active {
      animation: textShake 0.4s ease-in-out;
    }

    /* BURBUJAS DE OPCIONES */
    .options-grid {
      flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; padding: 0.5rem; 
      margin-bottom: calc(0.5rem + env(safe-area-inset-bottom)); /* Corrección barra gestos */
    }
    .option-btn {
      /* Fuente más compacta porque los polinomios son largos */
      font-size: clamp(0.95rem, 4vw, 1.4rem); 
      font-weight: 900; font-family: monospace; padding: 1rem 0.2rem; 
      border-radius: 16px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center;
      color: var(--text-main); text-align: center; line-height: 1.2;
    }
    .option-btn:active { transform: scale(0.95); }
    
    .opt-c1 { background: rgba(225, 29, 72, 0.1); border: 2px solid var(--accent-main); }
    .opt-c2 { background: rgba(56, 189, 248, 0.1); border: 2px solid #38bdf8; }
    .opt-c3 { background: rgba(249, 115, 22, 0.1); border: 2px solid #f97316; }
    .opt-c4 { background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981; }

    .option-btn.correct { background: var(--accent-success) !important; border-color: var(--accent-success) !important; color: #022c22 !important; box-shadow: 0 0 25px rgba(16, 185, 129, 0.6); }
    .option-btn.correct sup, .option-btn.correct .sqrt { color: #022c22 !important; }
    .option-btn.wrong { background: var(--accent-op) !important; border-color: var(--accent-op) !important; color: #fff !important; box-shadow: 0 0 25px rgba(244, 63, 94, 0.6); }
    .option-btn.wrong sup, .option-btn.wrong .sqrt { color: #fff !important; }
    .option-btn.disabled { pointer-events: none; opacity: 0.25; transform: scale(0.95); }

    .success-anim {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
      font-size: 6rem; opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none; z-index: 100;
    }
    .success-anim.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

    /* TARJETA DE EXPLICACIÓN */
    #feedback-panel {
      position: fixed; bottom: -150%; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px;
      background: var(--bg-card); border: 3px solid #f43f5e; padding: 1.5rem; box-sizing: border-box;
      border-radius: 20px; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 50;
      box-shadow: 0 15px 40px rgba(244, 63, 94, 0.4);
    }
    #feedback-panel.show { bottom: 20px; }
    
    .feedback-title { font-size: 1.3rem; font-weight: 900; margin-bottom: 0.8rem; color: #f43f5e; display: flex; align-items: center; gap: 0.5rem; }
    .feedback-text { font-size: 1.1rem; line-height: 1.4; color: var(--text-main); margin-bottom: 1.5rem; }
    .feedback-text strong { color: var(--accent-main); }
    [data-theme="light"] .feedback-text strong { color: #be123c; }

    .btn-next {
      width: 100%; padding: 1rem; background: #f43f5e; color: #fff; border: none;
      border-radius: 12px; font-size: 1.1rem; font-weight: 900; cursor: pointer; text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="top-controls">
    <button class="sound-toggle-btn" type="button" onclick="DojoAudio.toggleMute()" aria-label="Silenciar o activar sonido" title="Sonido">
      <span class="sound-icon">🔊</span>
    </button>
    <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Cambiar tema">
      <span id="theme-icon">☀️</span>
    </button>
  </div>

  <div id="screen-home">
    <div class="app-logo">
      <img src="crests/katana-binomios.svg" class="app-logo-crest" alt="Katana de Binomios">
    </div>
    <h1 class="app-title">Katana de los Binomios</h1>
    <p class="app-subtitle">Domina los Productos Notables</p>

    <div class="levels-grid">
      <button class="mode-btn btn-blanco" data-level="iniciado" onclick="startGame('iniciado')">
        <div class="belt-pill-icon" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none"><rect x="4" y="8" width="28" height="8" rx="2.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><rect x="4" y="20" width="28" height="8" rx="2.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><circle cx="18" cy="18" r="5.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><path d="M16 23 L13 33 L19 32 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><path d="M20 23 L23 33 L17 32 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/></svg>

      </button>

      <button class="mode-btn btn-naranja" data-level="guerrero" onclick="startGame('guerrero')">
        <div class="belt-pill-icon" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none"><rect x="4" y="8" width="28" height="8" rx="2.5" fill="#f97316" stroke="#ea580c" stroke-width="1.8"/><rect x="4" y="20" width="28" height="8" rx="2.5" fill="#f97316" stroke="#ea580c" stroke-width="1.8"/><circle cx="18" cy="18" r="5.5" fill="#fb923c" stroke="#ea580c" stroke-width="1.8"/><path d="M16 23 L13 33 L19 32 Z" fill="#f97316" stroke="#ea580c" stroke-width="1.2"/><path d="M20 23 L23 33 L17 32 Z" fill="#f97316" stroke="#ea580c" stroke-width="1.2"/></svg>
        </div>
        <div class="belt-pill-body">
          <span class="belt-pill-title">Cinturón Naranja · Guerrero</span>

        <div class="belt-pill-icon" aria-hidden="true">

        <div class="belt-pill-body">

      <button class="mode-btn btn-negro" data-level="shogun" onclick="startGame('shogun')">
        <div class="belt-pill-icon" aria-hidden="true">

  <div id="screen-game">
    <div class="game-header">
      <button class="btn-back" onclick="goHome()">← Salir</button>
      <div class="score-board">Racha: <span id="score-count">0</span> 🔥 <span class="best-stat" id="best-count"></span></div>

  <script>
    function initTheme() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      document.getElementById('theme-icon').textContent = isLight ? '🌙' : '☀️';
    }
    function toggleTheme() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('mathlab_theme', 'dark');
        document.getElementById('theme-icon').textContent = '☀️';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('mathlab_theme', 'light');
        document.getElementById('theme-icon').textContent = '🌙';
      }
    }
    window.addEventListener('DOMContentLoaded', initTheme);

    // ================= MOTOR DE PRODUCTOS NOTABLES =================
    let currentMode = '';
    let currentData = {};
    let racha = 0;
    let buttonsDisabled = false;

    function rand(min, max, avoidZero = true) {
      let val;
      do {
        val = Math.floor(Math.random() * (max - min + 1)) + min;
      } while (avoidZero && val === 0);
      return val;
    }

    // Nivel 1: (x+a)^2, (x-a)^2, (x+a)(x-a)
    function generateIniciado() {
      let a = rand(1, 6, true);
      let type = rand(1, 3, true);
      let q, ansStr, exp, opts = [];

      if (type === 1) {
        q = `(x + ${a})<sup>2</sup>`;
        ansStr = `x<sup>2</sup> + ${2*a}x + ${a*a}`;
        opts = [ansStr, `x<sup>2</sup> + ${a*a}`, `x<sup>2</sup> + ${a}x + ${a*a}`, `x<sup>2</sup> + ${2*a}x + ${a*2}`];
        exp = `Es el Cuadrado de una Suma:<br><strong>1º al cuadrado</strong> (x²) + <strong>Doble del 1º por el 2º</strong> (2·${a}·x = ${2*a}x) + <strong>2º al cuadrado</strong> (${a}² = ${a*a}).`;
      } else if (type === 2) {
        q = `(x - ${a})<sup>2</sup>`;
        ansStr = `x<sup>2</sup> - ${2*a}x + ${a*a}`;
        opts = [ansStr, `x<sup>2</sup> + ${a*a}`, `x<sup>2</sup> - ${a*a}`, `x<sup>2</sup> - ${a}x + ${a*a}`];
        exp = `Es el Cuadrado de una Resta:<br><strong>1º al cuadrado</strong> (x²) - <strong>Doble del 1º por el 2º</strong> (-${2*a}x) + <strong>2º al cuadrado siempre suma</strong> (+${a*a}).`;
      } else {
        q = `(x + ${a})(x - ${a})`;
        ansStr = `x<sup>2</sup> - ${a*a}`;
        opts = [ansStr, `x<sup>2</sup> + ${a*a}`, `x<sup>2</sup> - ${2*a}x - ${a*a}`, `x - ${a*a}`];
        exp = `Suma por diferencia = <strong>Diferencia de cuadrados</strong>.<br>Simplemente (1º al cuadrado) menos (2º al cuadrado): x² - ${a*a}.`;
      }
      return { q, ansStr, exp, opts };
    }

    // Nivel 2: (ax+b)^2 o (x^2-b)^2
    function generateGuerrero() {
      let b = rand(1, 5, true);
      let type = rand(1, 3, true);
      let q, ansStr, exp, opts = [];

      if (type === 1) { // (ax+b)^2
        let a = rand(2, 4, true);
        q = `(${a}x + ${b})<sup>2</sup>`;
        ansStr = `${a*a}x<sup>2</sup> + ${2*a*b}x + ${b*b}`;
        opts = [ansStr, `${a}x<sup>2</sup> + ${b*b}`, `${a*a}x<sup>2</sup> + ${a*b}x + ${b*b}`, `${a*a}x<sup>2</sup> + ${b*b}`];
        exp = `Eleva todo el primer término al cuadrado ((${a}x)² = <strong>${a*a}x²</strong>), calcula el doble producto (2·${a}x·${b} = <strong>${2*a*b}x</strong>) y eleva el segundo (${b}² = <strong>${b*b}</strong>).`;
      } else if (type === 2) { // (x^2 - b)^2
        q = `(x<sup>2</sup> - ${b})<sup>2</sup>`;
        ansStr = `x<sup>4</sup> - ${2*b}x<sup>2</sup> + ${b*b}`;
        opts = [ansStr, `x<sup>4</sup> + ${b*b}`, `x<sup>4</sup> - ${b}x<sup>2</sup> + ${b*b}`, `x<sup>4</sup> - ${2*b}x + ${b*b}`];
        exp = `Potencia de potencia se multiplica: (x²)² = <strong>x⁴</strong>. El doble producto mantiene el x² (-${2*b}x²).`;
      } else { // (ax + b)(ax - b)
        let a = rand(2, 4, true);
        q = `(${a}x + ${b})(${a}x - ${b})`;
        ansStr = `${a*a}x<sup>2</sup> - ${b*b}`;
        opts = [ansStr, `${a}x<sup>2</sup> - ${b*b}`, `${a*a}x<sup>2</sup> + ${b*b}`, `${a*a}x<sup>2</sup> - ${2*a*b}x - ${b*b}`];
        exp = `Diferencia de cuadrados. Recuerda elevar también el coeficiente: (${a}x)² - ${b}² = <strong>${a*a}x² - ${b*b}</strong>.`;
      }
      return { q, ansStr, exp, opts };
    }

    // Nivel 3: Raíces (√x + b)^2, (√x+b)(√x-b)
    function generateSamurai() {
      let b = rand(2, 6, true);
      let type = rand(1, 2, true);
      let q, ansStr, exp, opts = [];

      if (type === 1) { // (√x - b)^2
        q = `(<span class="sqrt">√</span>x - ${b})<sup>2</sup>`;
        ansStr = `x - ${2*b}<span class="sqrt">√</span>x + ${b*b}`;
        opts = [ansStr, `x + ${b*b}`, `x - ${b}<span class="sqrt">√</span>x + ${b*b}`, `x<sup>2</sup> - ${2*b}<span class="sqrt">√</span>x + ${b*b}`];
        exp = `La raíz se anula con el cuadrado ((√x)² = <strong>x</strong>). El término central junta número y raíz (-2·${b}·√x = <strong>-${2*b}√x</strong>).`;
      } else { // (√x + b)(√x - b)
        q = `(<span class="sqrt">√</span>x + ${b})(<span class="sqrt">√</span>x - ${b})`;
        ansStr = `x - ${b*b}`;
        opts = [ansStr, `x<sup>2</sup> - ${b*b}`, `x + ${b*b}`, `<span class="sqrt">√</span>x - ${b*b}`];
        exp = `Suma por diferencia: (√x)² - ${b}². Al elevar una raíz cuadrada al cuadrado, se queda solo la <strong>x</strong> (sin cuadrado).`;
      }
      return { q, ansStr, exp, opts };
    }

    // Nivel 4: Factorización Inversa y factor común
    function generateShogun() {
      let a = rand(1, 4, true);
      let type = rand(1, 3, true);
      let q, ansStr, exp, opts = [];

      if (type === 1) { // Inversa (x+a)^2
        q = `x<sup>2</sup> + ${2*a}x + ${a*a}`;
        ansStr = `(x + ${a})<sup>2</sup>`;
        opts = [ansStr, `(x - ${a})<sup>2</sup>`, `(x + ${a*a})<sup>2</sup>`, `(x + ${a})(x - ${a})`];
        exp = `El primer término es x², el último es ${a}² y el del medio es 2·${a}x positivos. Se "pliega" como el Cuadrado de una Suma.`;
      } else if (type === 2) { // Inversa dif cuadrados a^2x^2 - b^2
        let b = rand(2, 5, true);
        q = `${a*a}x<sup>2</sup> - ${b*b}`;
        ansStr = `(${a}x + ${b})(${a}x - ${b})`;
        opts = [ansStr, `(${a}x - ${b})<sup>2</sup>`, `(${a*a}x + ${b})(${a*a}x - ${b})`, `(${a}x + ${b*b})(${a}x - ${b*b})`];
        exp = `Son dos términos restando y ambos tienen raíz exacta (${a}x y ${b}). Proviene de una suma por diferencia.`;
      } else { // Factor común + Inversa: 2x^2 - 12x + 18 -> 2(x-3)^2
        let k = rand(2, 3, true); // factor
        let b = rand(2, 4, true);
        q = `${k}x<sup>2</sup> - ${k*2*b}x + ${k*b*b}`;
        ansStr = `${k}(x - ${b})<sup>2</sup>`;
        opts = [ansStr, `(${k}x - ${b})<sup>2</sup>`, `${k}(x + ${b})<sup>2</sup>`, `${k}(x - ${b*b})<sup>2</sup>`];
        exp = `¡Trampa Shogun! Primero saca factor común el <strong>${k}</strong>: ${k}(x² - ${2*b}x + ${b*b}). Luego pliega el polinomio de dentro.`;
      }
      return { q, ansStr, exp, opts };
    }

    const classColors = ['opt-c1', 'opt-c2', 'opt-c3', 'opt-c4'];

    const GAME_ID = 'notables';
    window.GAME_ID = GAME_ID;
    window.addEventListener('DOMContentLoaded', () => {
      if (window.DojoStats) DojoStats.syncGameLevels(GAME_ID);
    });

    function startGame(level) {
      currentMode = level;
      racha = 0;
      updateScore();
      refreshBestDisplay();
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById('screen-game').style.display = 'flex';
      nextProblem();
    }

    function goHome() { window.location.href = 'index.html'; }
    function updateScore() { document.getElementById('score-count').textContent = racha; }

    function refreshBestDisplay() {
      const best = window.DojoStats ? DojoStats.getBest(GAME_ID, currentMode) : 0;
      const bestEl = document.getElementById('best-count');
      if (bestEl) {
        bestEl.textContent = best > 0 ? `· Récord: ${best}` : '';
      }
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function nextProblem() {
      document.getElementById('feedback-panel').classList.remove('show');
      buttonsDisabled = false;

      if (currentMode === 'iniciado') currentData = generateIniciado();
      else if (currentMode === 'guerrero') currentData = generateGuerrero();
      else if (currentMode === 'samurai') currentData = generateSamurai();
      else currentData = generateShogun();
      
      const displayEl = document.getElementById('problem-display');
      displayEl.innerHTML = currentData.q;
      
      // Adaptación de tamaño si la expresión es muy larga (especial para polinomios desarrollados)
      if (currentData.q.length > 18) displayEl.classList.add('long-math');
      else displayEl.classList.remove('long-math');

      // Mezclamos las opciones
      let optionsArray = shuffle([...currentData.opts]);
      currentData.optionsMap = optionsArray;

      for (let i = 0; i < 4; i++) {
        let btn = document.getElementById(`opt-${i}`);
        btn.innerHTML = `<span class="key-hint">${i + 1}</span>${optionsArray[i]}`; 
        btn.className = `option-btn ${classColors[i]}`;
      }
    }

    function createExplosion(x, y) {
      // Emojis temáticos que saldrán disparados
      const emojis = ['✨', '🔥', '⚔️', '🥋', '💥', '💯'];
      const numParticles = 12;

      for (let i = 0; i < numParticles; i++) {
        let p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        document.body.appendChild(p);

        let angle = Math.random() * Math.PI * 2;
        let velocity = 60 + Math.random() * 120;
        let tx = Math.cos(angle) * velocity;
        let ty = Math.sin(angle) * velocity;
        let rot = Math.random() * 360;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            p.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${Math.random() * 0.8 + 0.5})`;
            p.style.opacity = '0';
          });
        });

        setTimeout(() => p.remove(), 800);
      }
    }

    function checkAnswer(btnIndex) {
      if (buttonsDisabled) return;
      buttonsDisabled = true;

      const isCorrect = (currentData.optionsMap[btnIndex] === currentData.ansStr);
      
      for (let i = 0; i < 4; i++) {
        let btn = document.getElementById(`opt-${i}`);
        if (currentData.optionsMap[i] === currentData.ansStr) btn.classList.add('correct');
        else if (i === btnIndex && !isCorrect) btn.classList.add('wrong');
        else btn.classList.add('disabled');
      }

      if (isCorrect) {
        racha++;
        updateScore();

        // Audio y Haptic
        if (window.DojoAudio) {
          DojoAudio.play('slash');
          if (racha % 5 === 0) DojoAudio.play('combo');
        }

        // Persistencia
        if (window.DojoStats) {
          const statRes = DojoStats.recordStreak(GAME_ID, currentMode, racha);
          if (statRes && statRes.justMastered && window.DojoAudio) {
            DojoAudio.play('gong');
          }
          refreshBestDisplay();
        }
        
        // Efecto partículas
        const btnElement = document.getElementById(`opt-${btnIndex}`);
        const rect = btnElement.getBoundingClientRect();
        createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);

        // Efecto Pantalla Completa y Latido
        document.body.classList.add('flash-active');
        document.getElementById('problem-display').classList.add('pop-active');
        
        setTimeout(() => { 
          document.body.classList.remove('flash-active');
          document.getElementById('problem-display').classList.remove('pop-active');
        }, 600);

        setTimeout(() => { nextProblem(); }, 800); 
      } else {
        racha = 0; 
        updateScore();

        if (window.DojoAudio) DojoAudio.play('clash');
        
        // Efecto Pantalla Completa y Temblor (Fallo)
        document.body.classList.add('error-active');
        document.getElementById('problem-display').classList.add('shake-active');
        
        setTimeout(() => { 
          document.body.classList.remove('error-active');
          document.getElementById('problem-display').classList.remove('shake-active');
        }, 500);
        
        document.getElementById('feedback-desc').innerHTML = currentData.exp;
        setTimeout(() => { document.getElementById('feedback-panel').classList.add('show'); }, 300);
      }
    }

    // Soporte teclado físico
    document.addEventListener('keydown', (e) => {
      const feedbackPanel = document.getElementById('feedback-panel');
      if (feedbackPanel && feedbackPanel.classList.contains('show')) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
          e.preventDefault();
          nextProblem();
        }
        return;
      }

      const gameScreen = document.getElementById('screen-game');
      if (!gameScreen || gameScreen.style.display !== 'flex' || buttonsDisabled) return;

      if (e.key === '1' || e.key === 'a' || e.key === 'A') checkAnswer(0);
      else if (e.key === '2' || e.key === 'b' || e.key === 'B') checkAnswer(1);
      else if (e.key === '3' || e.key === 'c' || e.key === 'C') checkAnswer(2);
      else if (e.key === '4' || e.key === 'd' || e.key === 'D') checkAnswer(3);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Error', err));
      });
    }
  </script>
</body>
