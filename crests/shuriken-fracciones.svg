<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="shurikenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shurikenBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#shurikenGlow)"/>

  <!-- Sello Mon Octogonal -->
  <circle cx="50" cy="50" r="42" fill="#0f172a" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="50" cy="50" r="37" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Shuriken de 4 Puntas Aerodinámico -->
  <path d="M50 16 L56 40 L78 30 L64 48 L86 50 L64 56 L78 74 L56 64 L50 88 L44 64 L22 74 L36 56 L14 50 L36 48 L22 30 L44 40 Z" fill="url(#shurikenBlade)" stroke="#22d3ee" stroke-width="1.5" filter="drop-shadow(0 0 8px rgba(6, 182, 212, 0.6))"/>

  <!-- Núcleo Central: Fracción Vertical Limpia a/b -->
  <circle cx="50" cy="50" r="14" fill="#0b1120" stroke="#06b6d4" stroke-width="2"/>
  <!-- Línea de Fracción Central -->
  <line x1="41" y1="50" x2="59" y2="50" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Numerador y Denominador -->
  <circle cx="50" cy="42" r="3" fill="#38bdf8"/>
  <circle cx="50" cy="58" r="3" fill="#a5f3fc"/>
</svg>
