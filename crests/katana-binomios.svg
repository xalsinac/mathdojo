<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="katanaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#katanaGlow)"/>

  <!-- Sol Rojo Tradicional / Sello Circular -->
  <circle cx="50" cy="50" r="42" fill="#0f172a" stroke="#f43f5e" stroke-width="3"/>
  <circle cx="50" cy="50" r="34" fill="rgba(244, 63, 94, 0.22)"/>

  <!-- Hoja Curva de Katana Slicing -->
  <path d="M20 78 Q42 50 82 22 Q75 32 48 60 Q32 75 20 78 Z" fill="url(#bladeGrad)" stroke="#fda4af" stroke-width="1.2" filter="drop-shadow(0 0 8px rgba(255,255,255,0.7))"/>
  <!-- Línea de filo Hamon -->
  <path d="M22 76 Q44 48 80 23" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 1.5"/>

  <!-- Tsuba (Guarda de la Katana) -->
  <ellipse cx="28" cy="70" rx="6" ry="10" transform="rotate(-40 28 70)" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Empuñadura Tsuka -->
  <path d="M24 74 L14 84" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  <path d="M24 74 L14 84" stroke="#f43f5e" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Pétalos de Sakura y Destellos de Binomio (a+b)² -->
  <path d="M68 56 C72 50 78 52 76 58 C74 64 66 60 68 56 Z" fill="#fda4af" opacity="0.9"/>
  <path d="M42 32 C45 28 50 29 48 34 C46 39 40 36 42 32 Z" fill="#fda4af" opacity="0.9"/>
  <circle cx="82" cy="22" r="3" fill="#ffffff" filter="drop-shadow(0 0 6px #fff)"/>
  <!-- Pequeño exponente 2 estelar -->
  <text x="68" y="38" fill="#fde047" font-size="14" font-weight="900" font-family="JetBrains Mono, monospace">²</text>
</svg>
