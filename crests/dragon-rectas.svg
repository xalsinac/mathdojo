<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="dragonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dragonScale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#dragonGlow)"/>

  <!-- Sello Mon Dragón -->
  <circle cx="50" cy="50" r="42" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
  <circle cx="50" cy="50" r="37" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.2"/>

  <!-- Rejilla Cartesiana Fina de Fondo -->
  <line x1="24" y1="50" x2="76" y2="50" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="50" y1="24" x2="50" y2="76" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Dragón Serpentino Oriental Enroscado -->
  <path d="M28 66 C22 50 34 32 50 30 C66 28 78 40 74 56 C70 70 54 74 44 68 C36 62 40 50 50 50 C58 50 62 56 60 62" fill="none" stroke="url(#dragonScale)" stroke-width="5" stroke-linecap="round"/>

  <!-- Cabeza de Dragón con Bigotes y Ojos -->
  <circle cx="28" cy="64" r="5" fill="#34d399"/>
  <circle cx="27" cy="63" r="1.5" fill="#fde047"/>
  <path d="M25 67 C20 72 16 70 14 74" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Recta Vectorial Ascendente de Fuego (Pendiente Positiva m > 0) -->
  <line x1="22" y1="78" x2="78" y2="22" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" filter="drop-shadow(0 0 6px #f43f5e)"/>
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5"/>

  <!-- Parámetros m y n -->
  <text x="76" y="32" fill="#fbbf24" font-size="12" font-weight="900" font-family="JetBrains Mono, monospace">m</text>
  <text x="54" y="58" fill="#34d399" font-size="11" font-weight="900" font-family="JetBrains Mono, monospace">n</text>
</svg>
